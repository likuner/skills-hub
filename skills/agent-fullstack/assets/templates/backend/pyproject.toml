[project]
name = "{{PROJECT_NAME}}-backend"
version = "0.1.0"
description = "{{PROJECT_NAME}} backend: FastAPI + AgentScope (Python 3.12)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "agentscope>=2.0.10",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "sqlalchemy[asyncio]>=2.0.30",
    "aiosqlite>=0.20",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main", "agent", "config", "database", "models"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
